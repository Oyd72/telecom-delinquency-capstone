stages:
  prepare:
    cmd: python src/prepare_data.py
    deps:
      - src/prepare_data.py
      - data/raw
    outs:
      - data/processed

  train:
    cmd: python src/train_model.py
    deps:
      - src/train_model.py
      - data/processed
    outs:
      - models

  evaluate:
    cmd: python src/evaluate_model.py
    deps:
      - src/evaluate_model.py
      - models
      - data/processed
    outs:
      - reports
