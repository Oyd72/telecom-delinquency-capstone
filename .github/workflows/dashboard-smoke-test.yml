name: Dashboard smoke test

on:
  push:
    branches: [main]
    paths:
      - "dashboards/**"
      - "models/selected_model_metadata.json"
      - "models/selected_random_forest_isotonic.joblib"
      - "reports/tables/module4_classification_metrics.csv"
      - "reports/tables/module4_shap_summary.json"
      - "reports/tables/module4_counterfactual_summary.json"
      - "reports/tables/module4_fairness_robustness_summary.json"
      - "reports/tables/module4_operational_robustness_segments.csv"
      - "src/inference/predict_selected_model.py"
      - ".github/workflows/dashboard-smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboards/requirements.txt

      - name: Compile dashboard Python files
        run: python -m py_compile dashboards/streamlit_app.py dashboards/dashboard_utils.py dashboards/smoke_test.py

      - name: Run dashboard smoke test
        run: python dashboards/smoke_test.py

      - name: Start Streamlit and check health
        run: |
          streamlit run dashboards/streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill $APP_PID
              wait $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $APP_PID || true
          exit 1
