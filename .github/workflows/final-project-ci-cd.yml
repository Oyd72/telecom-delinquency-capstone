name: Final project CI/CD

on:
  push:
    branches: [final-monitoring, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test and application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-monitoring.txt
          pip install -r dashboards/requirements.txt

      - name: Run automated tests
        run: pytest -q

      - name: Compile deployment entry points
        run: |
          python -m py_compile             src/api/app.py             src/pipeline/prefect_etl.py             dashboards/streamlit_app.py             dashboards/monitoring_dashboard.py

      - name: Run stakeholder dashboard smoke test
        run: python dashboards/smoke_test.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Check monitoring dashboard starts
        run: |
          streamlit run dashboards/monitoring_dashboard.py             --server.headless true             --server.port 8502 > /tmp/monitoring-streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8502/_stcore/health; then
              kill $APP_PID
              wait $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/monitoring-streamlit.log
          kill $APP_PID || true
          exit 1

  deploy-api:
    name: Deploy public API
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/final-monitoring' || github.ref == 'refs/heads/main')
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --show-error --silent             "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

      - name: Explain skipped deployment
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "RENDER_DEPLOY_HOOK_URL is not configured."
          echo "Tests passed, but deployment was intentionally skipped."

      - name: Note Streamlit deployment path
        run: |
          echo "Both Streamlit apps are linked to the repository branch and redeploy from source changes through Streamlit Community Cloud."
